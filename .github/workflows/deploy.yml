name: Deploy YantraOS to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        env:
          EXPORT_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: "/Yantra-OS/next"
        run: npm run build

      - name: Assemble Combined Production Distribution
        run: |
          mkdir -p dist-site/next
          cp index.html styles.css app.js dist-site/
          cp -r out/* dist-site/next/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
